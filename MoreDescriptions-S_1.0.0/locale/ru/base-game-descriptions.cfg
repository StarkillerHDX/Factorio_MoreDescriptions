[mod-name]
MoreDescriptions-S=More Descriptions (Дополнительные описания)

[mod-description]
MoreDescriptions-S=Добавляет художественные описания практически ко всем предметам и сущностям в игре

[item-description]
display-panel=Программируемый экран для визуализации сигналов схемной сети.
repair-pack=Удобный набор, содержащий необходимые инструменты и материалы для восстановления повреждённых объектов.
stone=Базовое сырьё. Очень каменистое.
wood=Примитивное топливо и строительный материал, добываемый из местных деревьев планеты.
copper-ore=Необработанная медная руда, ожидающая переплавки в токопроводящие пластины.
iron-ore=Кровь промышленности; эта руда переплавляется в железные пластины, из которых строится фабрика.
uranium-ore=Плотная радиоактивная руда, необходимая для передовой энергетики и опасного оружия.
coal=Богатое углеродом ископаемое топливо, необходимое для питания ранней промышленности и последующей переработки в пластик.
copper-plate=Очищенная пластина высокопроводящей меди — основной компонент почти всех электронных деталей.
iron-plate=Основной строительный материал всей вашей фабрики.
steel-plate=Прочный сплав, необходимый для передового оборудования и инфраструктуры.
stone-brick=Камень, обожжённый в печи, превращается в однородные кирпичи для мощения, стен и более прочных конструкций.
iron-gear-wheel=Простая механическая деталь, образующая движущиеся части бесчисленных машин и механизмов.
iron-stick=Базовый железный стержень, в основном используемый при производстве рельсов.
copper-cable=Вытянутый из медных пластин неэкранированный кабель, проводящий электричество через бесчисленные машины.
copper-wire=Тонкая токопроводящая медная нить — самый фундаментальный элемент электрического соединения.
cliff-explosives=Для случаев, когда обрыв — лишь предложение! Навсегда убирает непроходимые скальные образования.
pistol=Простое надёжное оружие. Не самое мощное, но успокаивающее присутствие на враждебном мире.
submachine-gun=Автоматическое оружие, выпускающее большие объёмы боеприпасов, отлично подходит для контроля толпы.
vehicle-machine-gun=Тяжёлый пулемёт, предназначенный для установки на транспортные средства.

tank-machine-gun=Крупнокалиберный пулемёт, специально разработанный для установки на корпус танка.
tank-flamethrower=Установленный на транспортное средство огнемёт, извергающий поток горящего масла, чтобы испепелить всех на своём пути.
artillery-wagon-cannon=Вагон, способный доставлять взрывные снаряды к дальним целям из безопасности вашей железнодорожной сети.
rocket-launcher=Ручной гранатомёт, запускающий мощные снаряды.
spidertron-rocket-launcher=Набор автоматизированных высокотехнологичных ракетных установок — основное вооружение Спайдертрона.
flamethrower=Отличный инструмент для уничтожения больших групп агрессивной фауны. Может уничтожить местные экосистемы.
flamethrower-ammo=Контейнер с маслом, предназначенный для подачи под давлением и воспламенения огнемётом.
flamethrower-turret=Автоматическая оборонительная турель, окатывающая приближающихся врагов потоком огня.
artillery-turret=Стационарная система обороны дальнего радиуса действия, автоматически обстреливающая вражеские строения в пределах своей огромной дальности.
electronic-circuit=Основной мозг фабрики: эти разноцветные зелёные схемы — фундаментальный компонент почти всех автоматизированных систем.
advanced-circuit=Более сложный процессор, сочетающий электронные схемы с пластиком для открытия следующего уровня технологий.
processing-unit=Вершина вычислительной мощности докасмической эры: эти синие схемы необходимы для самых передовых технологий.
light-armor=Простой костюм из железных пластин, обеспечивающий базовый уровень защиты от опасностей чужого мира.
heavy-armor=Усиленный костюм из стальных пластин, обеспечивающий существенную защиту для начинающего инженера.
modular-armor=Передовой боевой костюм с модульной сеткой для установки личного снаряжения, позволяющий настраивать его на ходу.
power-armor=Значительное улучшение модульной брони с превосходной защитой и увеличенной сеткой снаряжения.
power-armor-mk2=Предпоследний костюм для личной защиты и оснащения.
rocket=Простой снаряд для ракетной установки, наносящий мощный кинетический удар по одиночной цели.
explosive-rocket=Улучшенная версия с взрывной боеголовкой, наносящая значительный урон по площади при попадании.
firearm-magazine=Стандартный магазин с патронами в металлической оболочке для раннего оружия.

piercing-rounds-magazine=Закалённые патроны, предназначенные для пробития прочных панцирей крупных и более устойчивых форм жизни.
laser-turret=Передовая оборонительная турель, стреляющая высокоэнергетическим лазерным лучом и питающаяся напрямую от вашей электросети.
solar-panel=Вырабатывает скромное количество электроэнергии из солнечного света днём, обеспечивая чистую энергию без загрязнения.
raw-fish=Скользкое создание, которое можно съесть для восстановления здоровья. Аптечки не требуются.
lab=Учреждение для научных исследований, потребляющее научные пакеты для открытия новых технологий.
science=Само понятие научного прогресса!
automation-science-pack=Флакон фундаментальных научных знаний, представляющий первые шаги к автоматизации и механизированному производству.
logistic-science-pack=Представляет исследования в области транспортировки и логистики, позволяя создавать более сложные и эффективные конструкции фабрик.
chemical-science-pack=Открывает секреты химии и обращения с жидкостями, необходимые для передовой обработки материалов и новых видов энергии.
military-science-pack=Научный пакет, посвящённый искусству войны. Станьте мастером оружия и обороны.
production-science-pack=Сосредоточен на принципах массового производства и эффективности, позволяя вашей фабрике производить больше с меньшими затратами.
utility-science-pack=Представляет прорывы в передовой робототехнике и высокотехнологичной инфраструктуре, значительно расширяя ваш арсенал.
space-science-pack=Данные с планетарной орбиты, дающие знания, необходимые для изучения самых передовых технологий и, возможно, самого космоса.
red-wire=Катушка провода красного цвета для подключения машин к схемной сети, обеспечивающая сложную автоматизацию и управление.
green-wire=Катушка провода зелёного цвета для подключения машин к схемной сети, обеспечивающая сложную автоматизацию и управление.
speed-module=Модуль улучшения, повышающий скорость работы машины за счёт увеличения энергопотребления.
speed-module-2=Более совершенный модуль скорости, обеспечивающий больший прирост скорости производства.
speed-module-3=Вершина технологии ускорения.
productivity-module=Особый модуль, дающий бонусную продукцию со временем, но снижающий скорость при увеличении энергопотребления и загрязнения. Применим только к промежуточным продуктам.
productivity-module-2=Улучшенный модуль продуктивности, обеспечивающий больший бонус к выпуску. Применим только к промежуточным продуктам.
productivity-module-3=Абсолютный инструмент для приумножения ресурсов. Применим только к промежуточным продуктам.
efficiency-module=Экологичное улучшение, снижающее энергопотребление и загрязнение машины. Минимальное энергопотребление — 20%.
efficiency-module-2=Более продвинутый модуль эффективности с большим снижением энергопотребления и загрязнения. Минимальное энергопотребление — 20%.
efficiency-module-3=Самый мощный модуль эффективности. Минимальное энергопотребление — 20%.

empty-module-slot=Место, зарезервированное для модуля.
shotgun=Мощное оружие ближнего боя, стреляющее широким разбросом дроби, эффективное против множества слабых врагов одновременно.
combat-shotgun=Полуавтоматический дробовик, предназначенный для длительного боя, с повышенным уроном и более высокой скорострельностью.
shotgun-shell=Стандартный патрон, набитый множеством металлических дробинок, для использования в дробовиках.
piercing-shotgun-shell=Продвинутые патроны для дробовика, снаряжённые закалёнными дробинками, способными пробивать вражескую броню.
defender-capsule=Развёртывает небольшого летающего боевого робота, который следует за вами и защищает вас в течение ограниченного времени.
distractor-capsule=Развёртывает робота, предназначенного для отвлечения внимания врагов, давая вам возможность атаковать или сбежать.
destroyer-capsule=Выпускает рой мощных агрессивных боевых роботов, которые ищут и уничтожают ближайших врагов смертоносными лазерными атаками.
poison-capsule=Метательная капсула, разбивающаяся при ударе и выпускающая токсичное облако, наносящее урон со временем.
slowdown-capsule=Создаёт липкое поле при ударе, резко замедляя движение любых организмов, проходящих через него.
grenade=Простая ручная граната с коротким запалом, полезная для уничтожения скоплений врагов или нежелательной растительности.
cluster-grenade=Разрушительное улучшение стандартной гранаты, которая взрывается и разбрасывает множество меньших зарядов по широкой области.
discharge-defense-remote=Пульт дистанционного управления для ручного запуска ударной волны от модуля разрядной защиты, установленного в вашей броне.
copy-paste-tool=Позволяет копировать конструкции фабрики и вставлять их в другом месте.
blueprint=Хранит схему ваших конструкций фабрики, позволяя быстро воспроизводить сложные постройки с помощью строительных роботов.
blueprint-book=Удобный органайзер, вмещающий несколько чертежей и позволяющий содержать коллекцию в порядке и лёгком доступе.
deconstruction-planner=Инструмент планирования, используемый для отметки объектов на удаление вашей сетью строительных роботов. Автоматизируйте снос.
upgrade-planner=Инструмент планирования, позволяющий отмечать объекты для автоматического улучшения до более высокого уровня строительными роботами.

sulfur=Жёлтый неметаллический элемент, создаваемый из нефтяного газа и воды, необходимый для производства серной кислоты и взрывчатки.
solid-fuel=Компактное высокоэнергетическое топливо, переработанное из нефтепродуктов, значительно превосходящее уголь для питания локомотивов и котлов.
plastic-bar=Универсальный полимер из нефтяного газа и угля, наиболее важен для производства продвинутых схем.
engine-unit=Сложный механический узел, используемый при строительстве транспортных средств и другого оборудования.
electric-engine-unit=Продвинутый двигатель, работающий на электричестве и являющийся ключевым компонентом высокоуровневых машин и летающих роботов.
flying-robot-frame=Базовый каркас для строительного или логистического робота.
explosives=Мощное химическое соединение, используемое при производстве продвинутых боеприпасов и инструментов для радикального изменения ландшафта.
battery=Хранит электрическую энергию для последующего использования.
barrel=Пустой стальной контейнер для транспортировки жидкостей без необходимости в трубах.
water-barrel=Бочка, заполненная водой.
crude-oil-barrel=Бочка, заполненная сырой нефтью.
petroleum-gas-barrel=Бочка, заполненная нефтяным газом.
light-oil-barrel=Бочка, заполненная лёгкой нефтью.
heavy-oil-barrel=Бочка, заполненная тяжёлой нефтью.
lubricant-barrel=Бочка, заполненная смазкой.
sulfuric-acid-barrel=Бочка, заполненная серной кислотой.

coin=Маленький золотой диск неизвестного происхождения. Возможно, он предназначался для торгового автомата, который так и не построили...
cannon-shell=Крупнокалиберный снаряд для танка, наносящий значительный физический урон одиночной цели.
explosive-cannon-shell=Улучшенный пушечный снаряд с взрывным наполнителем, наносящий урон по площади при попадании.
tank-cannon=Основное вооружение танка, способное стрелять мощными пушечными снарядами.
low-density-structure=Лёгкий, но прочный композитный материал, необходимый для ракетостроения.
rocket-fuel=Высокоэнергетическая смесь твёрдого топлива, предназначенная для запуска ракет.
nuclear-fuel=Невероятно плотный источник топлива из обогащённого урана, обеспечивающий огромную мощность для транспортных средств.
rocket-part=Один из ста жизненно важных компонентов, которые необходимо изготовить и собрать на ракетной шахте для запуска ракет.
concrete=Прочный строительный материал для мощения больших площадей, повышающий скорость ходьбы и вождения.
refined-concrete=Превосходный материал для мощения, дающий ещё больший прирост скорости.
hazard-concrete=Бетон с характерным жёлто-чёрным узором, идеально подходящий для разметки пешеходных дорожек или опасных зон.
refined-hazard-concrete=Сочетает высокий бонус скорости очищенного бетона с чётким предупреждающим узором. Польза для безопасности спорна.

rail=Участок стального пути, используемый для строительства железнодорожной сети.
landfill=Возвращённая земля, используемая для засыпки водоёмов и создания новой застраиваемой территории там, где её раньше не было.
uranium-235=Редкий делящийся изотоп урана — ключевой ингредиент для создания ядерной энергетики и разрушительного атомного оружия.
uranium-238=Распространённый и стабильный изотоп урана.
uranium-fuel-cell=Тщательно собранный топливный стержень с обогащённым ураном, готовый выделять огромное количество тепла в ядерном реакторе.
depleted-uranium-fuel-cell=Отработанные остатки уранового топливного элемента.
uranium-rounds-magazine=Лучший магазин для огнестрельного оружия, снаряжённый плотными патронами с урановым сердечником, обеспечивающими превосходный урон и бронепробиваемость.
uranium-cannon-shell=Тяжёлый пушечный снаряд с бронебойным сердечником из обеднённого урана, дающий значительный бонус к урону против крупных бронированных целей.
explosive-uranium-cannon-shell=Сочетает бронебойную мощь урана с взрывной боеголовкой для разрушительного урона по площади.
atomic-bomb=Оружие ужасающей разрушительной силы, способное испарить целые вражеские гнёзда в одной ослепительной вспышке.
artillery-shell=Массивный фугасный снаряд, предназначенный для дальнобойной бомбардировки артиллерийскими турелями и вагонами.
artillery-targeting-remote=Пульт, позволяющий вручную наводить артиллерию и обрушивать точный огонь на далёкие вражеские позиции.
spidertron-remote=Пульт дистанционного управления Спайдертроном для подачи команд движения.
satellite=Сложное орбитальное оборудование. Запустите его, чтобы раскрыть секреты дальнего космоса.

energy-shield-equipment=Модуль личной защиты, проецирующий регенерирующее энергетическое поле, поглощающее входящий урон до того, как пострадает ваше здоровье.
energy-shield-mk2-equipment=Улучшенный энергетический щит с большей ёмкостью поглощения и более быстрой перезарядкой.
battery-equipment=Модуль, хранящий скромное количество личной энергии и служащий буфером для энергоёмкого снаряжения.
battery-mk2-equipment=Батарейный модуль высокой ёмкости, способный хранить гораздо больший запас энергии.
solar-panel-equipment=Крошечная солнечная панель, встраиваемая в броню и дающая медленный, но стабильный приток энергии днём.
fission-reactor-equipment=Миниатюрный портативный реактор деления, генерирующий существенное и постоянное энергоснабжение.
personal-laser-defense-equipment=Автоматическая система обороны, которая сама стреляет по ближайшим врагам, беря энергию напрямую из запаса вашей брони.
discharge-defense-equipment=Оружие поражения по площади, которое можно зарядить для высвобождения электрического взрыва, наносящего урон всем ближайшим врагам.
exoskeleton-equipment=Набор силовых креплений для ног, значительно увеличивающий скорость вашего передвижения.
night-vision-equipment=Модуль оптического улучшения, освещающий окружение при слабом свете и превращающий самую тёмную ночь в ясный день с оранжевым оттенком.
belt-immunity-equipment=Модуль личного снаряжения, нейтрализующий эффект толчка транспортных лент и позволяющий свободно ходить по фабрике.
personal-roboport-equipment=Миниатюрный робопорт, позволяющий небольшому отряду личных строительных роботов выполнять ваши строительные приказы на ходу.
personal-roboport-mk2-equipment=Продвинутый личный робопорт, поддерживающий большее число роботов и обладающий значительно расширенным радиусом строительства.

[fluid-description]
water=Фундаментальная жидкость. Может нагреваться для выработки паровой энергии.
steam=Горячий результат кипячения воды под давлением, готовый приводить в движение турбины.
crude-oil=Чёрная кровь планеты; сырая углеводородная смесь, которую необходимо переработать, чтобы раскрыть её истинный потенциал.
light-oil=Универсальный продукт нефтепереработки с низкой вязкостью.
heavy-oil=Плотный продукт нефтепереработки с высокой вязкостью.
petroleum-gas=Самый летучий продукт нефтепереработки.
sulfuric-acid=Мощное и высококоррозионное химическое соединение.
lubricant=Жидкость, предназначенная для смазки механизмов.

[entity-description]
cargo-landing-pad=Объект для прибывающих грузовых капсул, обеспечивающий безопасную и точную доставку припасов с орбиты. Выполняет логистические запросы на предметы с орбитальных платформ.
cargo-landing-pad-remnants=Оставшиеся обломки...
cargo-pod=Контейнер, запущенный с орбиты.
cargo-pod-container=Грузовая капсула, успешно приземлившаяся и готовая к разборке для извлечения содержимого.
tree-proxy=Местная флора планеты; ценный источник древесины и естественный фильтр воздуха, поглощающий загрязнение, пока не засохнет.
tree-dying-proxy=Разлагающиеся остатки дерева, павшего жертвой токсичного воздействия фабричного загрязнения...
cliff=Непроходимое и надоедливое скальное образование, служащее естественной стеной и требующее мощной взрывчатки для удаления.
stone=Скальные образования, вросшие в землю.
wooden-chest=Небольшой простой контейнер для хранения ограниченного количества предметов.
copper-ore=Залежь сырой медной руды.
iron-ore=Залежь сырой железной руды.
uranium-ore=Светящаяся радиоактивная залежь руды.
coal=Пласт ископаемого топлива, найденный в земле.
stone-furnace=Примитивная печь, способная переплавлять руду в пригодные пластины. Скромное начало всей промышленности.
steel-furnace=Значительно улучшенная печь, изготовленная из стали.
electric-furnace=Современная чистая печь, работающая на электричестве.
transport-belt=Простая конвейерная лента, автоматически перемещающая предметы из одного места в другое.
fast-transport-belt=Красная улучшенная транспортная лента, перемещающая предметы вдвое быстрее базовой жёлтой ленты.
express-transport-belt=Ещё более быстрая транспортная лента.
underground-belt=Сегмент транспортной ленты, позволяющий предметам перемещаться под землёй.
fast-underground-belt=Более быстрый красный вариант подземной ленты.
express-underground-belt=Ещё более быстрый синий вариант подземной ленты.

electric-mining-drill=Автоматический горный бур, работающий на электричестве.
burner-mining-drill=Примитивный горный бур на топливе, идеально подходящий для запуска фабрики.
gun-turret=Надёжная автоматическая оборона, стреляющая патронами по приближающимся врагам.
laser-turret=Передовая оборонительная турель, стреляющая высокоэнергетическим лазерным лучом и питающаяся напрямую от вашей электросети.
flamethrower-turret=Автоматическая оборонительная турель, окатывающая приближающихся врагов потоком огня.
artillery-turret=Стационарная система обороны дальнего радиуса действия, автоматически обстреливающая вражеские строения в пределах своей огромной дальности.
burner-inserter=Простой манипулятор на топливе, способный работать без электричества.
inserter=Этот электрический манипулятор перемещает предметы из одной точки в другую.
long-handed-inserter=Манипулятор с увеличенной зоной действия, способный брать и размещать предметы на расстоянии двух клеток.
fast-inserter=Улучшенный синий манипулятор, перемещающий предметы значительно быстрее.
bulk-inserter=Специализированный манипулятор для высокопроизводительных задач, перемещающий больший стек предметов за раз.
iron-chest=Прочный сундук из железных пластин.
steel-chest=Сундук большой ёмкости, построенный из стали.
construction-robot=Неутомимый автомат, который строит, ремонтирует и разбирает объекты по вашим планам. Разве они не милые?
logistic-robot=Летающий курьер, транспортирующий предметы между сундуками логистической сети и вашим личным инвентарём. Тоже очарователен.
active-provider-chest=Фиолетовый логистический сундук, активно выталкивающий своё содержимое в сеть.
passive-provider-chest=Красный логистический сундук, делающий своё содержимое доступным для логистической сети.
storage-chest=Жёлтый логистический сундук, выполняющий роль общего склада.
buffer-chest=Зелёный логистический сундук, функционирующий одновременно как запрашивающий и как поставщик.
requester-chest=Синий логистический сундук, запрашивающий определённые предметы из сети.

beacon=Высокотехнологичный пилон, передающий эффекты установленных модулей всем ближайшим машинам. Эффект передачи складывается с убывающей отдачей.
car=Быстрый и простой автомобиль для исследований, оснащённый небольшим инвентарём и встроенным пулемётом.
spidertron=Великолепная вездеходная шагающая боевая платформа, способная преодолевать любые препятствия и управляться дистанционно для нанесения разрушений издалека.
tank=Тяжело бронированная боевая машина, которая жертвует скоростью ради живучести и огромной огневой мощи.
offshore-pump=Простой насос, размещаемый на берегу и предназначенный для постоянного забора жидкости.
pump=Встраиваемый в трубопровод насос, поддерживающий давление на больших расстояниях и обеспечивающий быструю загрузку и разгрузку вагонов-цистерн.
pipe=Базовый трубопровод для транспортировки различных жидкостей по фабрике.
pipe-to-ground=Пара труб, позволяющая жидкостям течь под землёй.
locomotive=Мощный двигатель, тянущий вагоны по вашей железнодорожной сети и обеспечивающий перевозку ресурсов на большие расстояния.
boiler=Сжигает топливо, чтобы нагревать воду и производить пар.
heat-exchanger=Используя огромное тепло от тепловой трубы для мгновенного превращения воды в высокотемпературный пар, теплообменники критически важны для энергетики высокого уровня.
heat-pipe=Специализированный трубопровод, эффективно передающий интенсивное тепло, генерируемое источником тепла.
small-electric-pole=Самый базовый опорный столб, используемый для распределения электричества на небольшой площади.
steam-engine=Примитивный генератор, преобразующий низкотемпературный пар в скромное, но надёжное электроснабжение.
steam-turbine=Мощный генератор, предназначенный для использования высокотемпературного пара от теплообменников.
assembling-machine-1=Базовый медленный сборочный автомат.
assembling-machine-2=Более быстрый и универсальный сборочный автомат. Совместим с жидкостями.
assembling-machine-3=Вершина базовой сборочной технологии.

centrifuge=Высокотехнологичная машина, использующая огромную центробежную силу для разделения изотопов урана.
oil-refinery=Массивная промышленная структура, которая нагревает и разделяет сырую нефть на более полезные жидкие и газообразные компоненты.
chemical-plant=Универсальное предприятие для сложного химического синтеза.
biter-spawner=Живая инопланетная структура, непрерывно порождающая кусачей для защиты своей территории и нападения на вашу фабрику.
land-mine=Скрытая одноразовая взрывчатка, детонирующая при приближении врага.
fish=Безобидное водное существо, которое можно собрать для быстрого восстановления здоровья.
solar-panel=Вырабатывает скромное количество электроэнергии из солнечного света днём, обеспечивая чистую энергию без загрязнения.
small-biter=Маленькое, но агрессивное существо, атакующее роями.
small-biter-corpse=Безжизненные останки маленького кусачего.
medium-biter=Более крупный и устойчивый кусачий.
medium-biter-corpse=Безжизненные останки среднего кусачего.
big-biter=Поистине грозный кусачий с прочным панцирем и мощным укусом.
behemoth-biter=Высший хищник вида кусачих — чудовищно крупное и живучее существо.
big-biter-corpse=Безжизненные останки большого кусачего.
behemoth-biter-corpse=Безжизненные останки кусачего-бегемота.
biter-spawner-corpse=Рассыхающиеся неактивные останки гнезда кусачих.
small-spitter=Дальнобойная разновидность кусачего, плюющаяся потоком кислотных снарядов с расстояния.
small-spitter-corpse=Безжизненные останки маленького плевуна.
medium-spitter=Эволюционировавший плевун с более мощной и дальнобойной кислотной атакой.
medium-spitter-corpse=Безжизненные останки среднего плевуна.
big-spitter=Опасный, тяжело бронированный плевун, чьи кислотные залпы могут быстро одолеть неподготовленную оборону.
behemoth-spitter=Абсолютная дальнобойная угроза: это существо выпускает разрушительные залпы кислоты, способные расплавить даже самую прочную броню.
big-spitter-corpse=Безжизненные останки большого плевуна.
behemoth-spitter-corpse=Безжизненные останки плевуна-бегемота.
spitter-spawner=Живой инопланетный улей, непрерывно производящий плевунов для защиты своей территории.
spitter-spawner-corpse=Рассыхающиеся неактивные останки гнезда плевунов.
radar=Автоматизированная сканирующая станция, постепенно открывающая участки карты и обеспечивающая постоянный обзор окружающей местности.
stone-wall=Простой, но эффективный оборонительный барьер, блокирующий движение как врагов, так и транспортных средств.
gate=Участок стены, автоматически открывающийся для вас и ваших транспортных средств и обеспечивающий безопасный проход.
lab=Учреждение для научных исследований, потребляющее научные пакеты для открытия новых технологий.
display-panel=Программируемый экран для визуализации сигналов схемной сети.
character=Инженер! Вы!
small-lamp=Простая электрическая лампа, освещающая окружающую местность.
rocket-silo=Колоссальная структура, необходимая для строительства и запуска ракет в космос.
roboport=Центральный узел логистической сети и сети строительных роботов.
splitter=Простой разделитель лент, который делит один поток предметов на два или балансирует две входящие линии.
fast-splitter=Улучшенный разделитель, рассчитанный на скорость и пропускную способность быстрых транспортных лент.
express-splitter=Ещё более быстрый разделитель.
train-stop=Обозначенная станция, на которой поездам можно задать остановку для погрузки, разгрузки и заправки.
rail-signal=Сигнал, разделяющий рельсы на блоки и предотвращающий столкновения поездов, пропуская в блок только один поезд за раз.
rail-chain-signal=Продвинутый железнодорожный сигнал, считывающий сигнал впереди себя и не позволяющий поезду войти в блок, если его путь до следующего сигнала также не свободен.
cargo-wagon=Железнодорожный вагон, предназначенный для перевозки большого количества твёрдых предметов.
fluid-wagon=Вагон-цистерна, предназначенный для перевозки большого объёма жидкостей.
artillery-wagon=Мобильная артиллерийская платформа, перемещающаяся по рельсам и способная обстреливать далёкие вражеские базы при остановке на станции.

arithmetic-combinator=Программируемое логическое устройство, выполняющее математические операции над сигналами схемной сети.
decider-combinator=Программируемое логическое устройство, проверяющее условие и выдающее сигналы только при его истинности.
selector-combinator=Внутренний логический компонент, используемый для выбора или фильтрации сигналов по заданным условиям.
constant-combinator=Простое устройство схемной сети, выдающее постоянные задаваемые пользователем сигналы.
power-switch=Переключатель, способный соединять или разъединять две энергосети.
programmable-speaker=Устройство, способное воспроизводить звуковые сигналы тревоги и отображать глобальные оповещения в зависимости от состояния схемной сети.
big-electric-pole=Прочный опорный столб с очень большой дальностью проводов.
medium-electric-pole=Универсальный опорный столб, предлагающий хороший баланс между длиной проводов и зоной покрытия.
accumulator=Большой аккумулятор, запасающий избыточную электроэнергию и отдающий её, когда потребление превышает выработку; необходим для стабилизации сетей на солнечной энергии.
substation=Высокомощный узел распределения энергии, покрывающий электричеством очень большую площадь.
small-worm-turret=Маленький неподвижный инопланетный организм, действующий как естественная турель и защищающий свою территорию потоками кислоты.
medium-worm-turret=Более крупный и живучий червь с более мощной кислотной атакой, представляющий большую угрозу.
big-worm-turret=Грозный оборонительный организм, чья прочная шкура и мощное кислотное плевки могут быстро уничтожить неосторожного инженера.
behemoth-worm-turret=Абсолютная местная стационарная оборона: этот чудовищный червь выпускает разрушительные залпы кислоты, способные расплавить даже самую прочную оборону.
small-worm-corpse=Безжизненные останки маленького червя.
medium-worm-corpse=Безжизненные останки среднего червя.
big-worm-corpse=Безжизненные останки большого червя.
behemoth-worm-corpse=Безжизненные останки червя-бегемота.
small-worm-corpse-burrowed=Зарывшаяся нижняя половина туши мёртвого маленького червя.
medium-worm-corpse-burrowed=Зарывшаяся нижняя половина туши мёртвого среднего червя.
big-worm-corpse-burrowed=Зарывшаяся нижняя половина туши мёртвого большого червя.
behemoth-worm-corpse-burrowed=Зарывшаяся нижняя половина туши мёртвого червя-бегемота.
defender=Небольшой боевой робот, следующий за своим владельцем и вступающий в бой с любыми ближайшими враждебными угрозами.
distractor=Специализированный робот, предназначенный для отвлечения вражеской агрессии и создания тактической возможности для своего владельца.
destroyer=Тяжело вооружённый боевой робот, автономно разыскивающий и уничтожающий вражеские единицы мощными лазерными лучами.
storage-tank=Большой резервуар для хранения огромного объёма любой жидкости.
pumpjack=Эта машина неустанно качает жидкости из глубин земли.
crude-oil=Богатая подземная залежь сырой нефти.
nuclear-reactor=Сердце атомной электростанции: эта передовая структура использует энергию ядерного деления для выработки колоссального количества тепла из урановых топливных элементов. Теплоотдача увеличивается при постройке рядом с другими реакторами.
character-corpse=Мрачный маркер гибели инженера. В нём всё ещё находятся все предметы, которые он нёс.
big-sand-rock=Большой песчаниковый валун, встречающийся в засушливых регионах и пригодный для добычи камня.
big-rock=Обычный крупный валун, который можно разбить для получения камня.
huge-rock=Массивное скальное образование, примечательное содержащимися в нём ценными пластами камня и угля.
