[item-description]
yumako-mash=Обработанная мякоть плода Юмако, дающая при употреблении концентрированный всплеск регенерации здоровья.
jelly=Очищенный гель, полученный из Желеореха, дающий при употреблении значительный временный прирост скорости передвижения.
iron-bacteria=Культура специализированных микроорганизмов, которые перерабатывают органику и концентрируют железо в пригодные для добычи образования. Завораживающе!
copper-bacteria=Колония модифицированных микробов, биологически перерабатывающих питательные вещества и осаждающих чистую медь. Завораживающе!
bioflux=Мощный, высокопитательный органический кристалл, созданный из уникальной флоры Глебы и служащий сильным катализатором в передовых биологических процессах.
artificial-yumako-soil=Тщательно подготовленный субстрат, имитирующий особые заболоченные условия, необходимые для роста деревьев Юмако.
overgrowth-yumako-soil=Улучшенная почва, укреплённая стойкими микробами и позволяющая выращивать деревья Юмако в любом месте их родного биома.
artificial-jellynut-soil=Синтетическое болото, воспроизводящее точные экологические факторы, необходимые для выращивания инопланетного Желеостебля.
overgrowth-jellynut-soil=Более крепкая и адаптируемая почва, позволяющая выносливому Желеостеблю процветать в любой части его родного биома.
nutrients=Базовое органическое соединение, переработанное из сырой биомассы. Очень питательно (но не для вас).
jellynut=Странный, дрожащий плод, собранный с растения Желеостебель на Глебе и дающий всплеск скорости передвижения при употреблении.
yumako-seed=Семя дерева Юмако, готовое к посадке в подходящую почву.
jellynut-seed=Семя причудливого Желеостебля, готовое к посадке в подходящую почву.
tree-seed=Обычное семя дерева, родом с Наувиса.
ice=Замёрзшая вода. Как мило.
scrap=Неразборчивые, сломанные остатки технологий древней цивилизации, которые можно разобрать на более знакомые материалы.
space-platform-foundation=Модульный структурный каркас для орбитального строительства, используемый для расширения размеров вашей космической платформы.
space-platform-starter-pack=Сжатый пакет, содержащий ключевые компоненты, необходимые для создания действующего узла на планетарной орбите.
agricultural-science-pack=Венец ксеноботанической инженерии: этот пакет открывает возможность культивировать и промышленно перерабатывать инопланетную биологию.
metallic-asteroid-chunk=Фрагмент астероида с высокой концентрацией обычных промышленных металлов.
carbonic-asteroid-chunk=Фрагмент астероида, состоящий в основном из углерода.
oxide-asteroid-chunk=Кусок астероида, богатый оксидами.
promethium-asteroid-chunk=Редкий и экзотический фрагмент астероида, встречающийся только вблизи расколотой планеты.
big-mining-drill=Тяжёлый горный бур с более широкой рабочей зоной, достаточно мощный, чтобы добывать самые твёрдые внеземные руды. Он ещё и эффективнее!
calcite=Кристаллический минерал, содержащий захваченные летучие вещества. Воистину универсальный катализатор.
captive-biter-spawner=Некогда враждебное гнездо кусачих, ныне умиротворённое постоянным рационом из биофлюкса и перепрофилированное для контролируемого сбора яиц кусачих...
biolab=Гротескное слияние инопланетной биологии и фабричной инженерии; это перепрофилированное гнездо кусачих теперь служит живой лабораторией, способной проводить исследования со сверхвысокой эффективностью.
capture-robot-rocket=Специализированная нелетальная ракета, доставляющая робота для впрыскивания биофлюкса в гнездо, чтобы умиротворить и захватить его.

carbon=Фундаментальный элемент, необходимый для создания передовых композитов, таких как углеволокно или топливо для двигателей.
crusher=Опасного вида машина, предназначенная для измельчения астероидных фрагментов в удобные для обработки материалы.
cryogenic-plant=Специализированное промышленное предприятие, изолированное и усиленное для работы с экстремальным холодом, необходимым для криогенных исследований и процессов сжижения.
cryogenic-science-pack=Это ядро данных содержит исследования, проведённые при температурах, близких к абсолютному нулю, и открывает мощные энергетические системы.
promethium-science-pack=Флакон глубокого научного озарения, используемый для значительного повышения продуктивности исследований.
electromagnetic-science-pack=Открывает более глубокое понимание магнитных полей и физики высоких энергий, что критически важно для разработки передового энергетического оружия и материалов.
fusion-power-cell=Чрезвычайно плотный и долговечный источник энергии, обеспечивающий огромную мощность для легендарного термоядерного реактора.
holmium-ore=Редкоземельный металл, встречающийся в руинах металлолома на Фулгоре и обладающий уникальными магнитными свойствами, необходимыми для передовой электроники.
holmium-plate=Очищенный гольмий, откованный в пластины, жизненно важные для создания мощных магнитов.
lithium=Высокоактивный и лёгкий щелочной металл, извлекаемый из солёных жидкостей Аквило.
lithium-plate=Прессованные листы чистого лития.
mech-armor=Вершина личной инженерии: тяжёлый силовой костюм, превращающий инженера в ходячую универсальную машину для строительства фабрик.
metallurgic-science-pack=Представляет открытия в области высокотемпературной плавки и изготовления сплавов, необходимые для работы с экзотическими внеземными металлами.
quantum-processor=Революционное вычислительное устройство, использующее квантовые явления для вычислений, далеко выходящих за рамки традиционных процессоров.
railgun=Грозное электромагнитное оружие, запускающее твёрдый снаряд с гиперзвуковой скоростью и способное пробить самую прочную броню.
railgun-ammo=Плотный, стабилизированный оперением снаряд из закалённого металла, предназначенный для электромагнитного разгона рельсотроном.
supercapacitor=Продвинутое устройство хранения энергии, способное почти мгновенно отдать огромную мощность, необходимое для питания импульсного энергетического оружия.
superconductor=Чудесный материал, передающий электричество с нулевым сопротивлением и составляющий сердце самых передовых технологий.
tesla-ammo=Специализированный энергетический блок, хранящий заряд, необходимый для создания дугового разряда электричества для тесла-пушки.
teslagun=Экспериментальное оружие, стреляющее разрядом цепной молнии, поражающим основную цель и затем перескакивающим на дополнительных ближайших врагов.

tungsten-carbide=Исключительно твёрдая и термостойкая керамика, созданная путём соединения вольфрама с углеродом.
tungsten-ore=Удивительно плотная и прочная руда, встречающаяся только на раскалённой планете Вулкан и требующая тяжелых буров для добычи.
tungsten-plate=Пластина очищенного вольфрама, ценимая за невероятную прочность и чрезвычайно высокую температуру плавления.
turbo-splitter=Абсолютно самый быстрый в технологии разделения лент, предназначенный для идеальной балансировки и разделения невероятной пропускной способности турбо-транспортных лент.
turbo-transport-belt=Транспортная лента по последнему слову техники, перемещающая предметы с умопомрачительной скоростью и представляющая вершину логистической инженерии.
turbo-underground-belt=Подземный вариант турбо-транспортной ленты, обеспечивающий максимально быструю транспортировку предметов под препятствиями и другими путями.
yumako=Питательный, сладкий на вкус плод, дающий желанный всплеск регенерации здоровья при употреблении.
spoilage=В основном бесполезная разлагающаяся органика, остающаяся, когда биологические продукты слишком долго не используются. Можно сжечь.
carbon-fiber=Передовой композитный материал, сотканный из чистых углеродных нитей и ценимый за исключительное соотношение прочности и веса.
biter-egg=Собранное яйцо из пленного гнезда кусачих. Оно всё ещё может вылупиться и укусить вас.
pentapod-egg=Развивающееся яйцо пентапода. Они быстро вылупляются.
ice-platform=Усиленный лист льда, который можно укладывать на холодные жидкости для создания стабильной, пригодной для строительства поверхности.
foundation=Прочная, теплоизолированная структурная платформа с глубокими сваями, спроектированная для обеспечения стабильной основы для строительства на негостеприимных поверхностях, таких как лава или глубокие океаны. Чрезвычайно полезна.

toolbelt-equipment=Чудо миниатюризации, добавляющее дополнительные ячейки инвентаря в ваш личный пояс для инструментов и позволяющее носить больше предметов на ходу. Не задавайте вопросов.
battery-mk3-equipment=Личная батарея наивысшей ёмкости, способная хранить огромный запас энергии для самых энергоёмких конфигураций модульной брони.
fusion-reactor-equipment=Мощный миниатюрный термоядерный реактор, обеспечивающий существенное и постоянное энергоснабжение всего вашего личного снаряжения.
fluoroketone-hot-barrel=Бочка, заполненная горячим фторкетоном.
fluoroketone-cold-barrel=Бочка, заполненная холодным фторкетоном.

[fluid-description]
lava=Море расплавленной породы; её невероятное богатство минералами можно использовать для получения неограниченного количества металлов.
ammoniacal-solution=Ледяная сырая жидкость, богатая растворёнными минералами и химикатами, необходимыми для производства криогенной эры.
lithium-brine=Концентрированный раствор, содержащий ценный литий.
fluorine=Высокоактивный и летучий элемент, добываемый из глубин.
fluoroketone-cold=Передовой химический хладагент.
fluoroketone-hot=Передовой химический хладагент, отчаянно нуждающийся в охлаждении.
ammonia=Чистый очищенный аммиак.
molten-copper=Медь в полезной жидкой форме. Может быть отлита во множество форм и очертаний.
molten-iron=Железо в полезной жидкой форме. Может быть отлито во множество форм и очертаний.
holmium-solution=Кислотный раствор, содержащий растворённый гольмий.
electrolyte=Проводящая химическая жидкость, точно разработанная для обеспечения быстрой зарядки и разрядки высокоёмких суперконденсаторов.
thruster-fuel=Высокоэнергетическое жидкое топливо, предназначенное для смешивания с окислителем для создания огромной тяги, необходимой для межпланетных путешествий.
thruster-oxidizer=Мощный окислитель, который в сочетании с топливом для двигателей создаёт сильную химическую реакцию, необходимую для движения космической платформы сквозь пустоту.
fusion-plasma=Невероятно горячий поток ионизированных частиц, генерируемый внутри термоядерного реактора. Он может течь только через термоядерный генератор.



[entity-description]
vulcanus-chimney=Естественное вулканическое жерло, извергающее горячие серные газы из глубин Вулкана.
vulcanus-chimney-faded=Вулканическое жерло, проявляющее признаки снижения активности.
vulcanus-chimney-cold=Потухшее вулканическое жерло, больше не выделяющее ни тепла, ни газа.
vulcanus-chimney-short=Меньшее, но всё ещё активное вулканическое жерло.
vulcanus-chimney-truncated=Сломанные остатки некогда более высокого вулканического жерла.
huge-volcanic-rock=Массивный кусок магматической породы.
big-volcanic-rock=Крупный валун остывшей лавы, загромождающий пепельные равнины.
huge-volcanic-rock-hot=Массивный кусок магматической породы, всё ещё светящийся остаточным теплом.
big-volcanic-rock-hot=Крупный валун лавы, ещё не остывший и светящийся на пепельных равнинах.
biochamber=Герметичная стерильная камера для культивирования и переработки чувствительной биологической материи. Не присматривайтесь слишком внимательно.
scrap=Куча неразборчивых технологических обломков давно погибшей цивилизации. Похоже, подлежит переработке...
fulgoran-ruin-attractor=Остаток фулгорианской технологии, который, похоже, всё ещё притягивает и безвредно рассеивает удары молний.
fulgoran-ruin-stonehenge=Большое загадочное кольцо древних фулгорианских каменных монолитов.
fulgoran-ruin-vault=Рассыхающиеся останки, возможно, некогда сильно укреплённой фулгорианской структуры. Что внутри?
fulgoran-ruin-colossal=Воистину гигантские руины сооружения настолько огромного, что его первоначальное назначение невозможно постичь.
fulgoran-ruin-huge=Выветренные руины очень крупного сооружения забытой фулгорианской цивилизации.
fulgoran-ruin-big=Остатки фулгорианского здания, ныне истёртые веками ветра и пыли.
fulgoran-ruin-medium=Разрушающиеся руины скромного сооружения фулгорианского происхождения.
fulgoran-ruin-small=Несколько разбросанных битых камней — всё, что осталось от этих малых фулгорианских руин.
fulgora-sunk-ruin-big=Крупное фулгорианское здание, медленно поглощаемое пропитанными нефтью песками.
fulgora-sunk-ruin-medium-tall=Высокие фулгорианские руины, нижние этажи которых давно затоплены нефтяными песками.
fulgurite=Стекловидное трубчатое образование из спёкшегося песка и камня, созданное экстремальным жаром удара молнии.
fulgurite-small=Разбитые куски более крупного фульгуритового образования.
recycler=Хитроумная машина, предназначенная для разборки сложного технологического лома на базовые многоразовые компоненты. Переработка возвращает 25% исходных компонентов.
space-platform-hub=Командный и логистический центр орбитальной платформы, принимающий предметы с планеты внизу и отправляющий их по всей солнечной системе.
cargo-bay=Модульное расширение для хаба космической платформы, значительно увеличивающее ёмкость хранения предметов.
cargo-bay-remnants=Разбитые и бесполезные обломки уничтоженного грузового отсека...
landing-pad-unloading-bay=Расширение для грузовой посадочной площадки, позволяющее манипуляторам добираться до её общего инвентаря. Никаких роёв роботов!
tungsten-ore=Залежь чрезвычайно плотного и термостойкого вольфрама. Обычные буры не справятся.
calcite=Кристаллическая минеральная залежь, которую можно нагреть, чтобы высвободить захваченную воду и углеводородные летучие вещества.
sulfuric-acid-geyser=Естественное жерло, извергающее постоянное, пригодное для сбора облако концентрированной серной кислоты.

fluorine-vent=Естественная расщелина, выделяющая постоянный поток ценного газа фтора из недр планеты.
lithium-brine=Концентрированный бассейн богатого литием рассола, готового к добыче.
big-mining-drill=Тяжёлый горный бур с более широкой рабочей зоной, достаточно мощный, чтобы добывать самые твёрдые внеземные руды. Он ещё и эффективнее!
big-mining-drill-remnants=Сломанные, не подлежащие восстановлению обломки большого горного бура...
agricultural-tower=Автоматизированный кран, который сажает семена и собирает деревья всех видов.
asteroid-collector=Орбитальный объект, использующий мощный захват для поимки и сбора небольших астероидов, дрейфующих в его рабочую зону.
huge-metallic-asteroid=Массивный астероид, состоящий в основном из промышленных металлов. Разобрать его сможет только рельсотрон.
big-metallic-asteroid=Крупный астероид с высокой концентрацией металлов. Рекомендуются ракеты.
medium-metallic-asteroid=Астероид среднего размера, богатый металлическими рудами.
small-metallic-asteroid=Небольшой, легко собираемый астероид, содержащий ценные металлические ресурсы.
huge-carbonic-asteroid=Колоссальный астероид, богатый углеродом. Разобрать его сможет только рельсотрон.
big-carbonic-asteroid=Крупный астероид, богатый углеродом. Рекомендуются ракеты.
medium-carbonic-asteroid=Астероид среднего размера с высоким содержанием углерода.
small-carbonic-asteroid=Небольшой астероид, состоящий в основном из углерода и готовый к сбору.
huge-oxide-asteroid=Гигантский астероид, содержащий множество оксидов. Разобрать его сможет только рельсотрон.
big-oxide-asteroid=Крупный астероид, содержащий значительное количество оксидов. Рекомендуются ракеты.
medium-oxide-asteroid=Астероид среднего размера, состоящий из оксидов.
small-oxide-asteroid=Небольшой астероид, который можно переработать для получения воды.
huge-promethium-asteroid=Колоссальный астероид с расколотой планеты. Разобрать его сможет только рельсотрон.
big-promethium-asteroid=Крупный астероид, насыщенный экзотическим прометием. Рекомендуются ракеты.
medium-promethium-asteroid=Астероид среднего размера, содержащий заметное количество прометия.
small-promethium-asteroid=Небольшой фрагмент прометиевого астероида.
captive-biter-spawner=Некогда враждебное гнездо кусачих, ныне умиротворённое постоянным рационом из биофлюкса и перепрофилированное для контролируемого сбора яиц кусачих.
biolab=Гротескное слияние инопланетной биологии и фабричной инженерии; это перепрофилированное гнездо кусачих теперь служит живой лабораторией, способной проводить исследования со сверхвысокой эффективностью.
capture-robot=Специализированный автомат, который прикрепляется к целевому гнезду кусачих, чтобы умиротворить его для биологического сбора.
capture-robot-rocket=Специализированная нелетальная ракета, доставляющая робота для впрыскивания биофлюкса в гнездо, чтобы умиротворить и захватить его.

crusher=Опасного вида машина, предназначенная для измельчения астероидных фрагментов в удобные для обработки материалы.
cryogenic-plant=Специализированное промышленное предприятие, изолированное и усиленное для работы с экстремальным холодом, необходимым для криогенных исследований и процессов сжижения.
electromagnetic-plant=Высокотехнологичное предприятие для изготовления передовых компонентов, использующих мощные магнитные поля и сложные электрические принципы.
foundry=Передовая высокотемпературная печь, отливающая расплавленные металлы в специализированные промышленные детали.
fusion-reactor=Сердце звёздной энергии: этот передовой реактор синтезирует энергоячейки во фторкетоновой среде, производя невероятно горячую плазму. Выход плазмы увеличивается при постройке рядом с другими реакторами. Неограниченная энергия.
heating-tower=Высокоэффективная печь, сжигающая топливо или отходы для выработки тепла.
lightning-collector=Большой стержень, защищающий широкую область от ударов молний и безопасно преобразующий их огромную энергию в пригодное электричество.
lightning-rod=Простой заземлённый стержень, защищающий небольшую область от ударов молний и улавливающий их энергию для вашей энергосети.
railgun-turret=Оборонительная пушка дальнего радиуса действия, использующая электромагнитную силу для запуска разрушительно мощных снарядов как по врагам, так и по астероидам.
thruster=Массивный двигатель, прикрепляемый к космической платформе и потребляющий специализированное топливо для движения всей конструкции в межпланетных путешествиях.
tesla-turret=Передовая электрическая турель, поражающая ближайшего врага разрядом цепной молнии, перескакивающим на несколько дополнительных целей.
turbo-transport-belt=Транспортная лента по последнему слову техники, перемещающая предметы с умопомрачительной скоростью и представляющая вершину логистической инженерии.
turbo-underground-belt=Подземный вариант турбо-транспортной ленты, обеспечивающий максимально быструю транспортировку предметов под препятствиями и другими путями.
turbo-splitter=Абсолютно самый быстрый в технологии разделения лент, предназначенный для идеальной балансировки и разделения невероятной пропускной способности турбо-транспортных лент.
crater-cliff=Крутой непроходимый край огромного ударного кратера.
cliff-vulcanus=Изрезанное вулканическое скальное образование, созданное интенсивной геологической активностью Вулкана.
cliff-gleba=Обрыв из затвердевшей органической почвы и камня, обычный для холмистых регионов Глебы.
cliff-fulgora=Острый, выветренный ветром край плато на пустынной планете Фулгора.
slipstack=Кораллоподобный организм, родом с Глебы, выделяющий скользкое слизистое вещество.
cuttlepop=Странный гриб с Глебы, отличающийся гремящими споровыми капсулами и щупальцевидной корневой системой.
sunnycomb=Губчатый лишайник с Глебы, образующий характерную жёлтую корку при воздействии солнца.
teflilly=Растение с Глебы с необычайно прочными, похожими на пластик листьями.
yumako-tree=Местное дерево Глебы, приносящее питательный и весьма востребованный плод Юмако.
boompuff=Летучий лишайник Глебы, сбраживающий органику в сжатые взрывоопасные газы. Приближайтесь с осторожностью.
funneltrunk=Гриб с Глебы, разводящий червей внутри своей затвердевшей воронкообразной оболочки.
hairyclubnub=Древесный гриб с Глебы, использующий липкие волоски на булавовидных шляпках для ловли насекомых.
jellystem=Причудливое мясистое создание с Глебы, на котором растут странные студенистые Желеорехи.
lickmaw=Плотоядное и пугающее существо Глебы, использующее множество ртов и языковидных придатков для поедания добычи.
stingfrond=Тонкий лишайник Глебы, выпускающий мощные зазубренные жгуты, чтобы жалить всё, что подходит слишком близко.
ashland-lichen-tree=Выносливое дерево, приспособившееся к суровой пепельной среде Вулкана.
ashland-lichen-tree-flaming=Пепельное дерево, воспламенившееся от экстремального жара Вулкана и горящее как природный факел.

rocket-turret=Автоматическая оборонительная турель, запускающая непрерывный поток фугасных ракет по дальним целям.
lithium-iceberg-huge=Массивное образование замёрзшего рассола, исключительно богатое ценным литием.
lithium-iceberg-big=Крупный плавучий айсберг, содержащий значительную залежь лития.
gleba-spawner=Плавучее органическое гнездо, непрерывно выводящее агрессивных существ-пентаподов.
gleba-spawner-small=Меньший, но всё ещё опасный плот с яйцами пентаподов.
gleba-spawner-corpse=Безжизненные сдувшиеся останки гнезда Глебы.
gleba-spawner-corpse-small=Разлагающиеся остатки маленького гнезда Глебы.
small-stomper-pentapod=Разновидность пентапода, использующая тяжело бронированный панцирь и мощные ноги для прямого тарана целей.
small-strafer-pentapod=Проворный пентапод, который хаотично движется, уклоняясь от атак, и плюётся живыми снарядами.
small-wriggler-pentapod=Самая базовая форма пентапода — жалкое существо, атакующее простым выпадом.
small-wriggler-pentapod-corpse=Безжизненные останки маленького извивающегося пентапода.
small-wriggler-pentapod-premature=Только что вылупившийся недоразвитый извивающийся пентапод. Его участь уже предрешена.
medium-stomper-pentapod=Более крупный топтун-пентапод с более прочным панцирем и более сильным тараном.
medium-strafer-pentapod=Более развитый стрелок-пентапод с более быстрой и опасной дальнобойной атакой.
medium-wriggler-pentapod=Более крупный и живучий извивающийся пентапод.
medium-wriggler-pentapod-corpse=Безжизненные останки среднего извивающегося пентапода.
medium-wriggler-pentapod-premature=Недоразвитый извивающийся пентапод среднего размера. Его участь уже предрешена.
big-stomper-pentapod=Массивный, тяжело бронированный топтун, действующий как живая крепость и способный выдержать огромный урон.
big-strafer-pentapod=Самый опасный вариант стрелка, выпускающий мощные залпы недоразвитых извивающихся пентаподов, одновременно быстро меняя позицию.
big-wriggler-pentapod=Крупный и на удивление живучий извивающийся пентапод.
big-wriggler-pentapod-corpse=Безжизненные останки большого извивающегося пентапода.
big-wriggler-pentapod-premature=Недоразвитый извивающийся пентапод крупного размера. Его участь уже предрешена.
small-stomper-corpse=Безжизненные останки маленького топтуна-пентапода.
medium-stomper-corpse=Безжизненные останки среднего топтуна-пентапода.
big-stomper-corpse=Безжизненные останки большого топтуна-пентапода.
small-strafer-corpse=Безжизненные останки маленького стрелка-пентапода.
medium-strafer-corpse=Безжизненные останки среднего стрелка-пентапода.
big-strafer-corpse=Безжизненные останки большого стрелка-пентапода.
small-stomper-shell=Прочные останки маленького топтуна-пентапода.
medium-stomper-shell=Устойчивые останки среднего топтуна-пентапода.
big-stomper-shell=Невероятно прочные останки большого топтуна-пентапода.
fusion-generator=Специализированный генератор, потребляющий сверхгорячую плазму из термоядерного реактора и напрямую преобразующий её огромную энергию в электричество. Величайший источник энергии.
stack-inserter=Продвинутый манипулятор, способный брать и укладывать несколько предметов друг на друга, умножая пропускную способность.
big-fulgora-rock=Крупное, выветренное ветром скальное образование, часто встречающееся на пустынных равнинах Фулгоры.
small-demolisher=Колоссальное червеобразное существо с Вулкана, крайне территориальное и восстанавливающееся после повреждений с пугающей скоростью. Не тревожить.
medium-demolisher=Более крупный и ещё более живучий разрушитель, способный выдержать значительную огневую мощь.
big-demolisher=Самый крупный и ужасающий из местных обитателей Вулкана. Этот чудовищный червь — истинный левиафан, почти неуязвимый для всего, кроме самой сокрушительной силы.
vulcanus-cliff-collapse=Каскадный поток камней и обломков с обрушающегося вулканического обрыва.
iron-stromatolite=Скальное слоистое рифовое образование, созданное колониями железоосаждающих бактерий и пригодное для добычи в качестве железной руды.
copper-stromatolite=Рифоподобная залежь, образованная тысячелетиями медь-метаболизирующих бактерий и ставшая пригодным для добычи источником сырой медной руды.
small-demolisher-segment=Отдельный бронированный сегмент живого малого разрушителя, его каменистый панцирь светится от интенсивного внутреннего жара.
medium-demolisher-segment=Бронированный сегмент тела среднего червя-разрушителя, излучающий огромное тепло ядра существа.
big-demolisher-segment=Один из колоссальных перегретых сегментов, образующих тело великого разрушителя.
small-demolisher-tail=Бронированный хвостовой сегмент малого червя-разрушителя.
medium-demolisher-tail=Концевой сегмент тела разрушителя среднего размера.
big-demolisher-tail=Массивный сужающийся хвост великого разрушителя.
small-demolisher-corpse=Безжизненные останки малого разрушителя. Его невероятно плотный панцирь можно добыть для получения богатого выхода вольфрама.
medium-demolisher-corpse=Безжизненные останки среднего разрушителя. То, что когда-то было территориальной угрозой, теперь стало значительным источником вольфрама.
big-demolisher-corpse=Безжизненные останки великого разрушителя. Эта гора экзотической биомассы достаточно остыла, чтобы её можно было безопасно добывать ради огромных залежей вольфрама.

